<section id="shorts-2026-section" style="max-width: 960px; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px;">
    <h2 style="margin: 0; font-size: 18px;">2026</h2>
    <span id="shorts-2026-count" style="font-size: 13px; color: #6b7280;"></span>
  </div>

  <!-- 紧凑网格：适合 40+ 条，每张卡片带预览图，点击即播放 -->
  <div id="shorts-2026-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px;"></div>
</section>

<script>
  const SHORTS_2026 = [
    { id: "你的视频ID", title: "study-vlog 2026 Day1", duration: "1:08", date: "2026-11-23" }
    // 后续追加 40+ 条，只需按格式加对象：
    // { id: "xxxxxxxxxxx", title: "study-vlog 2026 Day2", duration: "0:52", date: "2026-11-24" },
  ];

  const grid = document.getElementById("shorts-2026-grid");
  const count = document.getElementById("shorts-2026-count");
  count.textContent = `共 ${SHORTS_2026.length} 条`;

  SHORTS_2026.forEach(item => {
    const card = document.createElement("div");
    card.style.cssText = "border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px; background: #fff; display: flex; flex-direction: column; gap: 6px;";

    // 预览图容器（竖屏比例，点击即替换为播放器）
    const thumbBox = document.createElement("div");
    thumbBox.style.cssText = "position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 8px; overflow: hidden; background: #111827; cursor: pointer;";

    const img = document.createElement("img");
    img.src = `https://i.ytimg.com/vi/${item.id}/hqdefault.jpg`;
    img.alt = item.title;
    img.loading = "lazy";
    img.style.cssText = "width: 100%; height: 100%; object-fit: cover; display: block;";

    // 播放按钮与时长角标
    const playBadge = document.createElement("div");
    playBadge.textContent = "▶";
    playBadge.style.cssText = "position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 999px; background: rgba(0, 0, 0, 0.72); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px;";

    const durBadge = document.createElement("span");
    durBadge.textContent = item.duration;
    durBadge.style.cssText = "position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 5px; background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 11px;";

    thumbBox.appendChild(img);
    thumbBox.appendChild(playBadge);
    thumbBox.appendChild(durBadge);

    thumbBox.addEventListener("click", () => {
      if (!item.id || item.id === "你的视频ID") return;
      thumbBox.innerHTML = `
        <iframe
          src="https://www.youtube.com/embed/${item.id}?autoplay=1"
          title="${item.title}"
          style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0;"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      `;
    });

    const titleEl = document.createElement("div");
    titleEl.textContent = item.title;
    titleEl.style.cssText = "font-size: 12px; font-weight: 600; color: #111827; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;";

    const dateEl = document.createElement("div");
    dateEl.textContent = item.date;
    dateEl.style.cssText = "font-size: 11px; color: #6b7280;";

    card.appendChild(thumbBox);
    card.appendChild(titleEl);
    card.appendChild(dateEl);
    grid.appendChild(card);
  });
</script>
